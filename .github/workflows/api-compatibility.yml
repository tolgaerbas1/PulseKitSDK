name: API Compatibility Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-compatibility:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check code format (Spotless)
      run: ./gradlew spotlessCheck

    - name: Run detekt
      run: ./gradlew detekt
      
    - name: Build project
      run: ./gradlew build

    - name: Run tests
      run: ./gradlew test

    - name: Generate Jacoco coverage reports
      run: ./gradlew :pulsekit-core:jacocoTestReport :pulsekit-android:jacocoTestReport --continue
      continue-on-error: true

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          **/build/reports/jacoco/**
          **/build/jacoco/*.exec
        retention-days: 14
      
    - name: Generate API snapshots
      run: ./gradlew generateApiSnapshot
      
    - name: Check API compatibility
      run: ./gradlew checkApiCompatibility
      
    - name: Check binary compatibility
      env:
        BASELINE_VERSION: 0.1.0
      run: ./gradlew checkBinaryCompatibility
      
    - name: Upload compatibility reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: compatibility-reports
        path: |
          **/build/reports/*.txt
          **/api/**/*.txt
        retention-days: 30
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Find compatibility reports
          const reports = [];
          
          // API compatibility reports
          const apiDir = 'pulsekit-core/api';
          if (fs.existsSync(apiDir)) {
            fs.readdirSync(apiDir).forEach(file => {
              if (file.includes('compatibility')) {
                reports.push(`pulsekit-core/${file}`);
              }
            });
          }
          
          // Binary compatibility reports
          const binaryDir = 'pulsekit-core/build/reports';
          if (fs.existsSync(binaryDir)) {
            fs.readdirSync(binaryDir).forEach(file => {
              if (file.includes('japicmp')) {
                reports.push(`pulsekit-core/build/reports/${file}`);
              }
            });
          }
          
          if (reports.length > 0) {
            let comment = '## 🔍 API Compatibility Report\n\n';
            comment += '### Reports Generated:\n';
            reports.forEach(report => {
              comment += `- \`${report}\`\n`;
            });
            
            comment += '\n### Status:\n';
            comment += '✅ API compatibility check completed\n';
            comment += '✅ Binary compatibility check completed\n';
            
            comment += '\n---\n';
            comment += '*This check ensures backward compatibility and prevents accidental breaking changes.*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
