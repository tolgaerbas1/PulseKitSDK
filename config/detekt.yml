# PulseKit detekt config (builds upon default)
# See: https://detekt.dev/docs/introduction/configurations

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: true

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 6
    constructorThreshold: 7
  CyclomaticComplexMethod:
    threshold: 15
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
    ignorePrivate: true
    ignoreOverridden: true

naming:
  ClassNaming:
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
  VariableNaming:
    variablePattern: '[a-z][A-Za-z0-9]*'
  PackageNaming:
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'

style:
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  MagicNumber:
    active: false
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4', '5', '10', '100', '1000']
    ignoreExtensionFunctions: true
  ObjectLiteralToLambda:
    active: true
  UnusedPrivateMember:
    active: true
  OptionalUnit:
    active: true
  RedundantHigherOrderMapUsage:
    active: true
  UnnecessaryApply:
    active: true
  UnnecessaryLet:
    active: true

comments:
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

potential-bugs:
  Deprecation:
    active: true
  EqualsWithHashCodeExist:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExitOutsideMain:
    active: true
  UnreachableCode:
    active: true
  HasPlatformType:
    active: false
  IgnoredReturnValue:
    active: true
  UnnecessarySafeCall:
    active: true

exceptions:
  SwallowedException:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  InstanceOfCheckForException:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  TooGenericExceptionCaught:
    active: false
    exceptionNames: ['Error', 'Exception', 'Throwable', 'RuntimeException']
  TooGenericExceptionThrown:
    active: false
    exceptionNames: ['Error', 'Exception', 'Throwable', 'RuntimeException']

performance:
  SpreadOperator:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true
