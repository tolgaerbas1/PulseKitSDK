# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin settings
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Android settings
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Publishing
GROUP=com.pulsekit
VERSION_NAME=0.1.0
POM_NAME=PulseKit
POM_DESCRIPTION=Production-grade telemetry SDK for Android apps and games
POM_URL=https://github.com/pulsekit/pulsekit
POM_SCM_URL=https://github.com/pulsekit/pulsekit
POM_SCM_CONNECTION=scm:git:git://github.com/pulsekit/pulsekit.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com:pulsekit/pulsekit.git
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=pulsekit
POM_DEVELOPER_NAME=PulseKit Team
POM_DEVELOPER_EMAIL=team@pulsekit.dev
SONATYPE_HOST=DEFAULT
RELEASE_SIGNING_ENABLED=false
